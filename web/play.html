<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>idlescape client</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    /* body (not html) is the grid so its own width stays definite and the canvas percentage resolves. */
    body { display: grid; place-items: center; }
    /* The element box itself keeps the 789x532 aspect: the client maps pointer coordinates off the
       canvas box, so the painted area and the box must always coincide. In the frame the iframe is
       already aspect-locked, so this is the full box; fullscreened onto a wider screen the width
       follows the height instead of stretching. */
    #canvas { display: block; width: min(100%, calc(100vh * 789 / 532)); height: auto; aspect-ratio: 789 / 532; background: #000; user-select: none; outline: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
<canvas id="canvas" width="789" height="532" tabindex="0" aria-label="Game view">Your browser cannot run the web client.</canvas>
<script type="module" src="/src/play.ts"></script>
</body>
</html>
