<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{padding:14px}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === "object" && v.Button && v.Icon) return v; } catch (e) {} } return {}; })();
const { Input, Select, Textarea, Checkbox, Segmented } = NS;
function Demo(){
  const [tab, setTab] = React.useState("My tasks");
  return <div style={{display:"flex",flexDirection:"column",gap:10,maxWidth:280}}>
    <Input placeholder="Search scripts" />
    <Input mono readOnly value="https://osrs.scotho.com/pair#7f3a…" />
    <div style={{display:"flex",gap:8,alignItems:"center"}}><Select defaultValue="Fit window"><option>1x</option><option>2x</option><option>Fit window</option></Select><label style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}><Checkbox defaultChecked /> Hide overlays</label></div>
    <Segmented options={["My tasks","Marketplace"]} value={tab} onChange={setTab} />
    <Textarea code rows={2} defaultValue={String.raw`await bot.chopTree("Tree")`} />
  </div>; }
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
